<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGL Media</title>
<style>
  :root {
    --paper: #E7E8E1;
    --card:  #F2F2ED;
    --ink:   #1B1D19;
    --ink2:  #55584F;
    --ink3:  #8A8D82;
    --rule:  #C9CBC0;
    --stamp: #A83A2B;
    --mono:  ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-size: 40px; line-height: 0.95; letter-spacing: 0.01em;
    text-transform: uppercase; margin: 0 0 16px;
  }
  .rule { height: 5px; display: flex; margin-bottom: 22px; }
  .rule span { flex: 1; }
  .label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 6px;
  }
  input, select {
    width: 100%; box-sizing: border-box; padding: 11px 12px; margin-bottom: 14px;
    font-family: inherit; font-size: 16px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 0;
  }
  select { -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  button {
    width: 100%; padding: 12px; font-family: inherit; font-size: 15px;
    text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--ink); color: var(--paper); border: none; cursor: pointer;
  }
  button:hover { background: var(--stamp); }
  button:disabled { background: var(--ink3); cursor: default; }
  button.quiet {
    background: none; color: var(--ink2); border: 1px solid var(--rule);
    font-size: 12px; padding: 9px;
  }
  button.quiet:hover { background: var(--card); color: var(--ink); }
  p { font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  .error {
    background: #F7E4E1; border-left: 3px solid var(--stamp); color: #7A2A1E;
    padding: 11px 13px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
  }
  .flash {
    background: #E3EBDF; border-left: 3px solid #4A7A42; color: #2F5429;
    padding: 11px 13px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
  }
  .hidden { display: none; }
  .who {
    font-family: var(--mono);
    font-size: 13px; word-break: break-all; margin-bottom: 20px;
  }

  /* ---- add a shoot ---- */
  #newshoot {
    border: 1px solid var(--ink); padding: 16px 16px 6px;
    margin-bottom: 20px;
  }
  .formtitle {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink);
    border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 14px;
  }
  .pair { display: flex; gap: 10px; }
  .pair > div { flex: 1; min-width: 0; }
  #openform { margin-bottom: 20px; }

  /* ---- the summary strip ---- */
  .tally {
    display: flex; background: var(--card);
    border: 1px solid var(--rule); margin-bottom: 20px;
  }
  .tally > div {
    flex: 1; min-width: 0; padding: 11px 10px 12px;
    border-left: 1px solid var(--rule);
  }
  .tally > div:first-child { border-left: none; }
  .tally .label { margin: 0; min-height: 26px; line-height: 1.2; }
  .tally .fig { font-family: var(--mono); font-size: 19px; line-height: 1.1; margin-top: 4px; }
  .tally .sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--ink3); margin-top: 5px;
  }

  /* ---- the shoot list ---- */
  .listhead {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 0;
  }
  .shootwrap {
    background: var(--card);
    border-left: 4px solid var(--ink3);
    border-bottom: 1px solid var(--rule);
    margin-bottom: 1px;
  }
  .shoot { display: flex; gap: 14px; padding: 13px 0 13px 12px; }
  .shoot .when { min-width: 92px; }
  .shoot .date {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink);
  }
  .shoot .time {
    font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-top: 3px;
  }
  .shoot .mid { flex: 1; min-width: 0; }
  .shoot .venue { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .shoot .client { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .shoot .type {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink3); margin-top: 5px;
  }
  .shoot .end {
    text-align: right; display: flex; flex-direction: column;
    justify-content: center; gap: 6px; min-width: 86px; padding-right: 6px;
  }
  .shoot .fee { font-family: var(--mono); font-size: 17px; }
  .shoot .status {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; border: 1px solid currentColor;
    padding: 1px 5px; align-self: flex-end;
  }
  /* ---- the row menu ---- */
  .dots {
    width: 36px; flex: 0 0 36px; padding: 0; align-self: stretch;
    background: none; color: var(--ink3);
    border: none; border-left: 1px solid var(--rule);
    font-size: 20px; line-height: 1; letter-spacing: 0;
  }
  .dots:hover { background: var(--rule); color: var(--ink); }
  .dots.open { background: var(--ink); color: var(--paper); }
  .menu { background: var(--paper); border-top: 1px solid var(--rule); padding: 12px 12px 2px; }
  .menu .error { margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    width: auto; flex: 0 0 auto; padding: 7px 11px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    background: var(--card); color: var(--ink2); border: 1px solid var(--rule);
  }
  .chip:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); cursor: default; }
  .chip.danger { color: var(--stamp); border-color: #D9BDB7; }
  .chip.danger:hover, .chip.armed {
    background: var(--stamp); color: var(--paper); border-color: var(--stamp);
  }

  .empty {
    padding: 26px 14px; text-align: center; color: var(--ink2);
    font-size: 14px; background: var(--card); border-bottom: 1px solid var(--rule);
  }
  .count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink3);
  }
  .spacer { height: 24px; }
</style>
</head>
<body>
<main>
  <div class="label">Production schedule</div>
  <h1>Shoot<br>days</h1>
  <div class="rule">
    <span style="background:#B8577A"></span>
    <span style="background:#3E6FA8"></span>
    <span style="background:#C09024"></span>
    <span style="background:#5E8C56"></span>
    <span style="background:#8A6BA8"></span>
    <span style="background:#B0603A"></span>
  </div>

  <div id="loading"><p>Loading&hellip;</p></div>

  <form id="login" class="hidden">
    <div id="error" class="error hidden"></div>
    <div class="label">Email</div>
    <input type="email" id="email" autocomplete="username" required>
    <div class="label">Password</div>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="signin">Sign in</button>
  </form>

  <div id="app" class="hidden">

    <div id="flash" class="flash hidden"></div>

    <button id="openform">Add a shoot</button>

    <form id="newshoot" class="hidden">
      <div class="formtitle" id="formtitle">Add a shoot</div>
      <div id="formerror" class="error hidden"></div>

      <div class="pair">
        <div>
          <div class="label">Date</div>
          <input type="date" id="f_date" required>
        </div>
        <div>
          <div class="label">Call time</div>
          <input type="time" id="f_time">
        </div>
      </div>

      <div class="label">Venue</div>
      <input type="text" id="f_venue" autocomplete="off" required>

      <div class="label">Client</div>
      <input type="text" id="f_client" autocomplete="off">

      <div class="pair">
        <div>
          <div class="label">Fee &pound;</div>
          <input type="number" id="f_fee" min="0" step="1" inputmode="decimal">
        </div>
        <div>
          <div class="label">Job type</div>
          <select id="f_type"></select>
        </div>
      </div>

      <div class="label">Status</div>
      <select id="f_status"></select>

      <button type="submit" id="save">Save shoot</button>
      <div style="height:8px"></div>
      <button type="button" class="quiet" id="cancel">Cancel</button>
      <div style="height:10px"></div>
    </form>

    <div class="tally">
      <div>
        <div class="label">Days ahead</div>
        <div class="fig" id="t_ahead">&mdash;</div>
        <div class="sub" id="t_ahead_sub"></div>
      </div>
      <div>
        <div class="label">Booked in</div>
        <div class="fig" id="t_booked">&mdash;</div>
        <div class="sub" id="t_booked_sub"></div>
      </div>
      <div>
        <div class="label">Owed</div>
        <div class="fig" id="t_owed">&mdash;</div>
        <div class="sub" id="t_owed_sub"></div>
      </div>
    </div>

    <div class="listhead">
      <span class="label" style="margin:0">Coming up</span>
      <span class="count" id="count"></span>
    </div>

    <div id="list"></div>

    <div class="spacer"></div>
    <div class="label">Signed in as</div>
    <div class="who" id="who"></div>
    <button class="quiet" id="signout">Sign out</button>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ============================================================
// Supabase dashboard -> Settings -> API Keys
// Use the PUBLISHABLE key (sb_publishable_...). Never the secret one.
// ============================================================
const SUPABASE_URL = 'https://ipjrkpwolsbukjztyguh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tFapTFCQ8GnPvcQWrTr47Q_tJv44iL0';
// ============================================================

// The options in the two dropdowns. These must match what the database
// will accept. Add or rename freely — the list is the only place they live.
const JOB_TYPES = ['wedding', 'corporate', 'event', 'music video', 'commercial', 'property'];
const STATUSES  = ['pencilled', 'confirmed', 'delivered', 'invoiced', 'paid'];

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const el = (id) => document.getElementById(id);
const show = (id) => el(id).classList.remove('hidden');
const hide = (id) => el(id).classList.add('hidden');

// Colour down the left edge of each row, by job type.
const TYPE_COLOUR = {
  'wedding':     '#B8577A',
  'corporate':   '#3E6FA8',
  'event':       '#C09024',
  'music video': '#5E8C56',
  'commercial':  '#8A6BA8',
  'property':    '#B0603A'
};

function statusColour(status) {
  if (status === 'paid') return '#4A7A42';
  if (status === 'invoiced' || status === 'delivered') return '#A83A2B';
  return '#55584F';
}

// '2026-08-15' -> 'SAT 15 AUG'
function longDate(value) {
  const [y, m, d] = value.split('-').map(Number);
  return new Date(y, m - 1, d)
    .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
    .toUpperCase();
}

// '13:00:00' -> '13:00'
function shortTime(value) {
  return value ? value.slice(0, 5) : '';
}

function money(value) {
  return '£' + Number(value || 0).toLocaleString('en-GB', { maximumFractionDigits: 0 });
}

function escapeText(value) {
  const node = document.createElement('div');
  node.textContent = value == null ? '' : value;
  return node.innerHTML;
}

function escapeAttr(value) {
  return escapeText(value).replace(/"/g, '&quot;');
}

function titleCase(value) {
  const text = String(value == null ? '' : value);
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function showError(message) {
  el('error').textContent = message;
  show('error');
}

// Today, in the local calendar rather than UTC.
function todayISO() {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}

let flashTimer = null;
function flash(message) {
  el('flash').textContent = message;
  show('flash');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => hide('flash'), 6000);
}

// The team this signed-in person belongs to. Needed on insert so the
// row passes the security policies. Stays null if we can't find it.
let teamId = null;

async function loadTeamId(userId) {
  teamId = null;
  let result = await supabase.from('profiles').select('team_id').eq('id', userId).maybeSingle();
  if (result.error || !result.data) {
    result = await supabase.from('profiles').select('team_id').eq('user_id', userId).maybeSingle();
  }
  if (result.data && result.data.team_id) teamId = result.data.team_id;
}

function fillSelect(id, values) {
  el(id).innerHTML = values
    .map((v) => `<option value="${escapeAttr(v)}">${escapeText(titleCase(v))}</option>`)
    .join('');
}

// Set a dropdown, keeping any value the database holds that isn't on our list.
function setSelect(id, value) {
  const node = el(id);
  const known = Array.from(node.options).some((o) => o.value === value);
  if (!known && value) {
    const extra = document.createElement('option');
    extra.value = value;
    extra.textContent = titleCase(value);
    node.appendChild(extra);
  }
  node.value = value || '';
}

fillSelect('f_type', JOB_TYPES);
fillSelect('f_status', STATUSES);

async function render(session) {
  hide('loading');
  if (!session) {
    hide('app');
    show('login');
    return;
  }
  hide('login');
  show('app');
  el('who').textContent = session.user.email;
  await loadTeamId(session.user.id);
  loadShoots();
}

let shoots = [];

async function loadShoots() {
  const { data, error } = await supabase
    .from('shoots')
    .select('id, shoot_date, call_time, venue, client, fee, job_type, status')
    .gte('shoot_date', todayISO())
    .order('shoot_date', { ascending: true });

  if (error) {
    el('list').innerHTML = '<div class="error">Error: ' + escapeText(error.message) + '</div>';
    el('count').textContent = '';
    return;
  }

  shoots = data;
  updateTally();

  if (!shoots.length) {
    el('list').innerHTML = '<div class="empty">Nothing booked in yet.</div>';
    el('count').textContent = '0 days';
    return;
  }

  el('count').textContent = shoots.length + (shoots.length === 1 ? ' day' : ' days');
  el('list').innerHTML = shoots.map(rowHTML).join('');
}

// Which statuses mean the work is done but the money isn't in, and which
// mean the job isn't firm yet. Both feed the summary strip.
const OWED_STATUSES = ['delivered', 'invoiced'];
const PROVISIONAL   = ['pencilled'];

async function updateTally() {
  const monthPrefix = todayISO().slice(0, 7);
  const monthName = new Date().toLocaleDateString('en-GB', { month: 'long' });

  const thisMonth = shoots.filter((s) => String(s.shoot_date).startsWith(monthPrefix)).length;

  let confirmed = 0;
  let provisional = 0;
  shoots.forEach((s) => {
    const fee = Number(s.fee || 0);
    if (PROVISIONAL.includes(s.status)) provisional += fee;
    else confirmed += fee;
  });

  el('t_ahead').textContent = shoots.length;
  el('t_ahead_sub').textContent = thisMonth + ' in ' + monthName;
  el('t_booked').textContent = money(confirmed);
  el('t_booked_sub').textContent = provisional ? money(provisional) + ' pencilled' : 'all confirmed';

  // Owed looks at every shoot, not just the ones ahead — most of what's
  // outstanding is work that's already happened.
  const { data, error } = await supabase.from('shoots').select('fee').in('status', OWED_STATUSES);

  if (error || !data) {
    el('t_owed').textContent = '—';
    el('t_owed_sub').textContent = 'unavailable';
    return;
  }

  const owed = data.reduce((sum, row) => sum + Number(row.fee || 0), 0);
  el('t_owed').textContent = money(owed);
  el('t_owed_sub').textContent = data.length + (data.length === 1 ? ' job' : ' jobs');
}

function rowHTML(shoot) {
  const colour = TYPE_COLOUR[shoot.job_type] || '#8A8D82';

  const statusChips = STATUSES.map((s) => `
        <button type="button" class="chip${s === shoot.status ? ' on' : ''}"
                data-act="status" data-id="${escapeAttr(shoot.id)}" data-value="${escapeAttr(s)}">${escapeText(titleCase(s))}</button>`).join('');

  return `
    <div class="shootwrap" style="border-left-color:${colour}">
      <div class="shoot">
        <div class="when">
          <div class="date">${longDate(shoot.shoot_date)}</div>
          <div class="time">${escapeText(shortTime(shoot.call_time))}</div>
        </div>
        <div class="mid">
          <div class="venue">${escapeText(shoot.venue)}</div>
          <div class="client">${escapeText(shoot.client || '—')}</div>
          <div class="type">${escapeText(shoot.job_type)}</div>
        </div>
        <div class="end">
          <div class="fee">${money(shoot.fee)}</div>
          <div class="status" style="color:${statusColour(shoot.status)}">${escapeText(shoot.status)}</div>
        </div>
        <button type="button" class="dots" data-act="menu" data-id="${escapeAttr(shoot.id)}"
                aria-expanded="false" aria-label="Options for ${escapeAttr(shoot.venue)}">&#8942;</button>
      </div>
      <div class="menu hidden">
        <div class="error hidden"></div>
        <div class="label">Status</div>
        <div class="chips">${statusChips}</div>
        <div class="chips">
          <button type="button" class="chip" data-act="edit" data-id="${escapeAttr(shoot.id)}">Edit details</button>
          <button type="button" class="chip danger" data-act="delete" data-id="${escapeAttr(shoot.id)}">Delete</button>
        </div>
      </div>
    </div>`;
}

function findShoot(id) {
  return shoots.find((s) => String(s.id) === String(id));
}

function closeAllMenus() {
  document.querySelectorAll('#list .menu').forEach((m) => m.classList.add('hidden'));
  document.querySelectorAll('#list .dots').forEach((d) => {
    d.classList.remove('open');
    d.setAttribute('aria-expanded', 'false');
  });
}

function menuError(menu, message) {
  const box = menu.querySelector('.error');
  box.textContent = message;
  box.classList.remove('hidden');
}

// An update or delete that the security policies block comes back with no
// error and no rows. Asking for the rows back is how we can tell.
async function changeRow(id, patch) {
  const query = patch
    ? supabase.from('shoots').update(patch).eq('id', id).select('id')
    : supabase.from('shoots').delete().eq('id', id).select('id');

  const { data, error } = await query;
  if (error) return error.message;
  if (!data || !data.length) {
    return 'Nothing changed — the database refused it. That usually means the security policies don\'t let this account edit that shoot.';
  }
  return null;
}

el('list').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;

  const id = button.dataset.id;
  const wrap = button.closest('.shootwrap');
  const menu = wrap.querySelector('.menu');
  const act = button.dataset.act;

  if (act === 'menu') {
    const wasOpen = !menu.classList.contains('hidden');
    closeAllMenus();
    if (!wasOpen) {
      menu.classList.remove('hidden');
      button.classList.add('open');
      button.setAttribute('aria-expanded', 'true');
    }
    return;
  }

  if (act === 'edit') {
    startEdit(id);
    return;
  }

  if (act === 'status') {
    const shoot = findShoot(id);
    const value = button.dataset.value;
    if (!shoot || shoot.status === value) { closeAllMenus(); return; }

    button.textContent = '…';
    const problem = await changeRow(id, { status: value });
    if (problem) {
      button.textContent = titleCase(value);
      menuError(menu, problem);
      return;
    }
    flash(shoot.venue + ' is now ' + value + '.');
    loadShoots();
    return;
  }

  if (act === 'delete') {
    if (button.dataset.armed !== '1') {
      button.dataset.armed = '1';
      button.classList.add('armed');
      button.textContent = 'Tap again to delete';
      setTimeout(() => {
        button.dataset.armed = '';
        button.classList.remove('armed');
        button.textContent = 'Delete';
      }, 5000);
      return;
    }

    const shoot = findShoot(id);
    button.textContent = 'Deleting…';
    const problem = await changeRow(id, null);
    if (problem) {
      button.dataset.armed = '';
      button.classList.remove('armed');
      button.textContent = 'Delete';
      menuError(menu, problem);
      return;
    }
    if (String(editingId) === String(id)) closeForm();
    flash((shoot ? shoot.venue : 'That shoot') + ' has gone.');
    loadShoots();
  }
});

// ---- add and edit ----

let editingId = null;

function openForm() {
  editingId = null;
  closeAllMenus();
  hide('formerror');
  hide('flash');
  el('newshoot').reset();
  fillSelect('f_type', JOB_TYPES);
  fillSelect('f_status', STATUSES);
  el('f_date').value = todayISO();
  el('formtitle').textContent = 'Add a shoot';
  el('save').textContent = 'Save shoot';
  show('newshoot');
  hide('openform');
  el('f_venue').focus();
}

function startEdit(id) {
  const shoot = findShoot(id);
  if (!shoot) return;

  editingId = shoot.id;
  closeAllMenus();
  hide('formerror');
  hide('flash');
  fillSelect('f_type', JOB_TYPES);
  fillSelect('f_status', STATUSES);

  el('f_date').value = shoot.shoot_date;
  el('f_time').value = shortTime(shoot.call_time);
  el('f_venue').value = shoot.venue || '';
  el('f_client').value = shoot.client || '';
  el('f_fee').value = shoot.fee == null ? '' : shoot.fee;
  setSelect('f_type', shoot.job_type);
  setSelect('f_status', shoot.status);

  el('formtitle').textContent = 'Edit shoot';
  el('save').textContent = 'Save changes';
  show('newshoot');
  hide('openform');
  el('newshoot').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function closeForm() {
  editingId = null;
  hide('newshoot');
  show('openform');
}

el('openform').addEventListener('click', openForm);
el('cancel').addEventListener('click', closeForm);

el('newshoot').addEventListener('submit', async (event) => {
  event.preventDefault();
  hide('formerror');

  const date  = el('f_date').value;
  const venue = el('f_venue').value.trim();
  const fee   = el('f_fee').value.trim();

  if (!date || !venue) {
    el('formerror').textContent = 'A date and a venue are needed before this can be saved.';
    show('formerror');
    return;
  }

  const row = {
    shoot_date: date,
    call_time:  el('f_time').value || null,
    venue:      venue,
    client:     el('f_client').value.trim() || null,
    fee:        fee === '' ? null : Number(fee),
    job_type:   el('f_type').value,
    status:     el('f_status').value
  };

  const saving = editingId;
  el('save').disabled = true;
  el('save').textContent = 'Saving…';

  let problem;
  if (saving) {
    problem = await changeRow(saving, row);
  } else {
    if (teamId) row.team_id = teamId;
    const { error } = await supabase.from('shoots').insert(row);
    problem = error ? error.message + (error.hint ? ' — ' + error.hint : '') : null;
  }

  el('save').disabled = false;
  el('save').textContent = saving ? 'Save changes' : 'Save shoot';

  if (problem) {
    el('formerror').textContent = problem;
    show('formerror');
    return;
  }

  closeForm();
  if (date < todayISO()) {
    flash(venue + ' saved. The date has passed, so it sits below Coming up rather than in it.');
  } else {
    flash(saving ? venue + ' updated.' : venue + ' added to the schedule.');
  }
  loadShoots();
});

// ---- auth ----

el('login').addEventListener('submit', async (event) => {
  event.preventDefault();
  hide('error');
  el('signin').disabled = true;
  el('signin').textContent = 'Signing in…';

  const { error } = await supabase.auth.signInWithPassword({
    email: el('email').value.trim(),
    password: el('password').value
  });

  el('signin').disabled = false;
  el('signin').textContent = 'Sign in';
  if (error) showError(error.message);
});

el('signout').addEventListener('click', async () => {
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((_event, session) => render(session));

const { data } = await supabase.auth.getSession();
render(data.session);
</script>
</body>
</html>
